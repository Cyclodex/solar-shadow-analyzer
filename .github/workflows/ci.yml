name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # no step pushes

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, Chromium, base ${{ matrix.base }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # At the root as in development, and under a subpath like the GitHub Pages project page (manifest and
        # service worker scope, share link keeping the path).
        base: ['/', '/solar-shadow-analyzer/']
    env:
      BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # no step pushes

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Browsers are only downloaded in CI; locally see README (Tests).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the app and serves it with `vite preview`; external APIs are blocked inside the specs.
      - name: E2E
        run: npm run e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # One artifact per matrix leg (names must be unique within a run; no "/" allowed).
          name: playwright-results-${{ strategy.job-index }}
          path: test-results
          retention-days: 7
